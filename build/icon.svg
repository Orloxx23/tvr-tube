<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="hsl(263, 70%, 60%)" />
      <stop offset="100%" stop-color="hsl(322, 84%, 60%)" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="20" />
      <feOffset dx="0" dy="12" result="off" />
      <feComponentTransfer><feFuncA type="linear" slope="0.35" /></feComponentTransfer>
      <feMerge><feMergeNode /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="200" ry="200" fill="url(#brand)" />
  <g filter="url(#shadow)" transform="translate(512 512)">
    <g stroke="#ffffff" stroke-width="64" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="0" y1="-220" x2="0" y2="200" />
      <polyline points="-160,40 0,200 160,40" />
      <line x1="-240" y1="280" x2="240" y2="280" />
    </g>
  </g>
</svg>
